<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f6f8">
    <title>知问 · 本地知识库</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="brand" href="/" aria-label="知问首页">
            <span class="brand-mark" aria-hidden="true">知</span>
            <span class="brand-copy"><strong>知问</strong><small>LOCAL KNOWLEDGE</small></span>
        </a>

        <button class="new-chat-button" id="newChatButton" type="button">
            <span aria-hidden="true">＋</span> 开始新对话
        </button>

        <section class="library">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">YOUR LIBRARY</p>
                    <h2>知识库</h2>
                </div>
                <span class="count-badge" id="documentCount">0</span>
            </div>

            <button class="upload-zone" id="uploadZone" type="button">
                <span class="upload-icon" aria-hidden="true">↑</span>
                <span class="upload-copy"><strong>添加知识文档</strong><small>点击或拖拽 TXT、MD 文件</small></span>
                <span class="upload-plus" aria-hidden="true">＋</span>
            </button>
            <input id="fileInput" type="file" accept=".txt,.md,text/plain,text/markdown" hidden>
            <p class="upload-hint">单个文件最大 20 MB</p>

            <div class="document-toolbar">
                <span>已上传文档</span>
                <button class="icon-button refresh-button" id="refreshButton" type="button" aria-label="刷新文档列表" title="刷新">↻</button>
            </div>
            <div class="document-list" id="documentList" aria-live="polite">
                <div class="list-placeholder">正在加载文档…</div>
            </div>
        </section>

        <div class="sidebar-footer">
            <span class="status-dot" aria-hidden="true"></span>
            <span><strong>本地知识库</strong><small>数据保存在本机</small></span>
            <span class="local-badge">LOCAL</span>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="breadcrumb"><span>工作区</span><span class="breadcrumb-slash">/</span><strong>知识问答</strong></div>
            <div class="topbar-right"><span class="model-indicator"><i></i> Ollama 本地模型</span></div>
        </header>

        <section class="chat-layout" aria-label="知识库问答">
            <div class="chat-heading">
                <div class="heading-icon" aria-hidden="true">✳</div>
                <div>
                    <p class="eyebrow">ASK YOUR KNOWLEDGE BASE</p>
                    <h1>有什么可以帮你？</h1>
                    <p class="heading-description">基于你上传的资料，快速找到答案与出处。</p>
                </div>
            </div>

            <div class="conversation" id="conversation" aria-live="polite">
                <div class="welcome-card" id="welcomeCard">
                    <div class="welcome-topline"><span class="sparkle" aria-hidden="true">✳</span> 你的知识，随时可问</div>
                    <p>我会从知识库中检索相关内容，整理答案并附上参考来源。试试下面的问题，或直接输入你想了解的内容。</p>
                    <div class="suggestions">
                        <button class="suggestion" type="button" data-question="这个知识库里有哪些内容？">
                            <span aria-hidden="true">⌕</span> 这个知识库里有哪些内容？
                        </button>
                        <button class="suggestion" type="button" data-question="请总结知识库中的重点。">
                            <span aria-hidden="true">✧</span> 请总结知识库中的重点
                        </button>
                        <button class="suggestion" type="button" data-question="如何开始使用这个项目？">
                            <span aria-hidden="true">↗</span> 如何开始使用这个项目？
                        </button>
                    </div>
                </div>
                <div class="messages" id="messages"></div>
            </div>

            <form class="composer" id="chatForm">
                <label class="sr-only" for="questionInput">输入你的问题</label>
                <textarea id="questionInput" rows="1" maxlength="1000" placeholder="向你的知识库提问…" required></textarea>
                <div class="composer-bottom">
                    <span class="composer-note"><span class="shield-icon" aria-hidden="true">◇</span> 回答仅基于已上传的知识文档</span>
                    <div class="composer-actions">
                        <span class="character-count" id="characterCount">0 / 1000</span>
                        <button class="send-button" id="sendButton" type="submit" aria-label="发送问题" title="发送问题">
                            <span aria-hidden="true">↑</span>
                        </button>
                    </div>
                </div>
            </form>
            <p class="disclaimer">AI 生成的内容可能不准确，请结合参考来源核实。</p>
        </section>
    </main>
</div>
<div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
<script src="/app.js" defer></script>
</body>
</html>
